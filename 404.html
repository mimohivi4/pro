<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting…</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f5fa; color: #111827; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { text-align: center; padding: 24px; }
    .spinner { width: 32px; height: 32px; border: 4px solid #e5e7eb; border-top-color: #4f46e5; border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #6b7280; }
    a { color: #4f46e5; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Redirecting…</p>
  </div>
  <script>
    (function () {
      var path = window.location.pathname.replace(/\/+$/, "");
      var parts = path.split("/").filter(Boolean);
      var code = parts.pop() || "";
      var base = parts.length ? "/" + parts.join("/") + "/" : "/";
      var target = null;
      fetch(base + "shortcodes.json")
        .then(function (r) {
          console.log("404-debug: map fetch status =", r.status);
          return r.ok ? r.json() : Promise.reject(new Error("map fetch not ok"));
        })
        .then(function (m) {
          console.log("404-debug: map loaded =", JSON.stringify(m));
          if (m && typeof m === "object") {
            target = m[code] || m[String(code).toUpperCase()] || null;
            console.log("404-debug: looked up code =", code, "=> target =", target);
          }
          if (target) {
            window.location.replace(target);
          } else {
            console.log("404-debug: no target found, falling back to base =", base);
            window.location.replace(base);
          }
        })
        .catch(function (e) {
          console.log("404-debug: fetch failed =", e);
          window.location.replace(base);
        });
    })();
  </script>
</body>
</html>
